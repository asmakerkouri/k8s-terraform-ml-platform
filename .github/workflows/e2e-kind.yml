name: E2E on kind

# Manual run: deploys the full platform in a throw-away kind cluster.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Deploy platform
        run: ./scripts/local-up.sh
      - name: Smoke test
        run: |
          kubectl -n ml port-forward svc/inference-ml-inference 8000:80 &
          sleep 5
          curl -fs localhost:8000/health
          kubectl -n ml get deploy,hpa,pods
